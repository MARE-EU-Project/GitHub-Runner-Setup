---
- name: Install exact Kubernetes client tools from official release artifacts
  ansible.builtin.include_tasks: artifact.yml
  loop:
    - name: kubectl
      enabled: "{{ kubectl_enabled }}"
      version: "{{ kubectl_version }}"
      url: "https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/amd64/kubectl"
      filename: "kubectl-v{{ kubectl_version }}"
      archive: false
      binary: kubectl
      checksum_url: "https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/amd64/kubectl.sha256"
    - name: minikube
      enabled: "{{ minikube_enabled }}"
      version: "{{ minikube_version }}"
      url: "https://storage.googleapis.com/minikube/releases/v{{ minikube_version }}/minikube-linux-amd64"
      filename: "minikube-v{{ minikube_version }}-linux-amd64"
      archive: false
      binary: minikube
      checksum_url: "https://storage.googleapis.com/minikube/releases/v{{ minikube_version }}/minikube-linux-amd64.sha256"
    - name: helm
      enabled: "{{ helm_enabled }}"
      version: "{{ helm_version }}"
      url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
      filename: "helm-v{{ helm_version }}-linux-amd64.tar.gz"
      archive: true
      binary: linux-amd64/helm
      checksum_url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz.sha256sum"
  loop_control:
    loop_var: tools_artifact
    label: "{{ tools_artifact.name }}"
  when: tools_artifact.enabled

- name: Install the matching Minikube KVM driver from its official release
  ansible.builtin.include_tasks: artifact.yml
  vars:
    tools_artifact:
      name: docker-machine-driver-kvm2
      version: "{{ minikube_version }}"
      url: "https://storage.googleapis.com/minikube/releases/v{{ minikube_version }}/docker-machine-driver-kvm2"
      filename: "docker-machine-driver-kvm2-v{{ minikube_version }}"
      archive: false
      binary: docker-machine-driver-kvm2
      checksum_url: "https://storage.googleapis.com/minikube/releases/v{{ minikube_version }}/docker-machine-driver-kvm2.sha256"
  when: minikube_enabled and virtualization_enabled and minikube_driver == 'kvm2'
