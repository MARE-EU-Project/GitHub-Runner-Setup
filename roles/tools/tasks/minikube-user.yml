---
- name: Create private runner Kubernetes configuration directory
  ansible.builtin.file:
    path: "/home/{{ tools_runner.user }}/.config/runner-kubernetes"
    state: directory
    owner: "{{ tools_runner.user }}"
    group: "{{ tools_runner.user }}"
    mode: "0700"

- name: Initialize only a new isolated kubeconfig
  ansible.builtin.copy:
    content: ""
    dest: "{{ tools_minikube_kubeconfig }}"
    force: false
    owner: "{{ tools_runner.user }}"
    group: "{{ tools_runner.user }}"
    mode: "0600"

- name: Create the root-owned profile ownership directory
  ansible.builtin.file:
    path: "/var/lib/runner-tools/minikube/{{ tools_runner.user }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Persist the exact profile identity before startup to allow safe retries
  ansible.builtin.copy:
    content: "{{ tools_minikube_identity | to_nice_json }}\n"
    dest: "{{ tools_minikube_marker }}"
    owner: root
    group: root
    mode: "0644"

- name: Start or recover only profiles identified by the read-only inspection
  become: true
  become_user: "{{ tools_runner.user }}"
  ansible.builtin.command:
    argv:
      - /usr/local/bin/minikube
      - start
      - "--profile={{ tools_minikube_profile }}"
      - "--driver={{ minikube_driver }}"
      - "--kubernetes-version=v{{ kubernetes_version }}"
      - "--cpus={{ minikube_cpus }}"
      - "--memory={{ minikube_memory_mb }}mb"
      - --interactive=false
  environment:
    HOME: "/home/{{ tools_runner.user }}"
    MINIKUBE_HOME: "/home/{{ tools_runner.user }}/.minikube"
    KUBECONFIG: "{{ tools_minikube_kubeconfig }}"
    LIBVIRT_DEFAULT_URI: qemu:///system
  changed_when: true
  when: tools_runner.user in tools_minikube_start_profiles

- name: Verify the managed profile is fully running
  become: true
  become_user: "{{ tools_runner.user }}"
  ansible.builtin.command:
    argv: [/usr/local/bin/minikube, status, "--profile={{ tools_minikube_profile }}", --output=json]
  environment:
    HOME: "/home/{{ tools_runner.user }}"
    MINIKUBE_HOME: "/home/{{ tools_runner.user }}/.minikube"
    KUBECONFIG: "{{ tools_minikube_kubeconfig }}"
    LIBVIRT_DEFAULT_URI: qemu:///system
  register: tools_minikube_final_status
  changed_when: false
  check_mode: false

- name: Assert managed cluster health
  ansible.builtin.assert:
    that:
      - (tools_minikube_final_status.stdout | from_json).Host == 'Running'
      - (tools_minikube_final_status.stdout | from_json).Kubelet == 'Running'
      - (tools_minikube_final_status.stdout | from_json).APIServer == 'Running'
      - (tools_minikube_final_status.stdout | from_json).Kubeconfig == 'Configured'

- name: Keep the isolated kubeconfig private
  ansible.builtin.file:
    path: "{{ tools_minikube_kubeconfig }}"
    owner: "{{ tools_runner.user }}"
    group: "{{ tools_runner.user }}"
    mode: "0600"

- name: Query the exact managed Kubernetes server version
  become: true
  become_user: "{{ tools_runner.user }}"
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - "--kubeconfig={{ tools_minikube_kubeconfig }}"
      - "--context={{ tools_minikube_profile }}"
      - version
      - --output=json
  environment:
    HOME: "/home/{{ tools_runner.user }}"
  register: tools_minikube_server_version
  changed_when: false
  check_mode: false

- name: Require the exact requested Kubernetes server release
  ansible.builtin.assert:
    that:
      - (tools_minikube_server_version.stdout | from_json).serverVersion.gitVersion == 'v' + kubernetes_version
