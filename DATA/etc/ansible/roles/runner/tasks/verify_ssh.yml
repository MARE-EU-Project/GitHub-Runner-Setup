---
- name: Read the effective SSH policy for the dedicated account
  become: true
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
      - -C
      - "user={{ runner_instance.user }},host=localhost,addr=127.0.0.1"
  register: runner_ssh_effective
  changed_when: false
  check_mode: false
  no_log: true

- name: Require an explicit SSH login denial for the dedicated account
  ansible.builtin.assert:
    that:
      - >-
        runner_instance.user in
        ((runner_ssh_effective.stdout_lines | select('match', '^denyusers ') |
          first | default('')).split()[1:])
    fail_msg: The SSH daemon does not include the managed runner account denial.
