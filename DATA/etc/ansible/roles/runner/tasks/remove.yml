---
- name: Validate removal configuration
  ansible.builtin.import_tasks: validate.yml

- name: Require explicit removal and maintenance approval
  ansible.builtin.assert:
    that:
      - runner_allow_removal | bool
      - runner_maintenance_confirmed | bool
    fail_msg: Removal requires both runner_allow_removal and runner_maintenance_confirmed.

- name: Remove only the explicitly listed managed runners
  ansible.builtin.include_tasks: remove_instance.yml
  loop: "{{ runner_instances }}"
  loop_control:
    loop_var: runner_instance
    label: "{{ runner_instance.name }}"
