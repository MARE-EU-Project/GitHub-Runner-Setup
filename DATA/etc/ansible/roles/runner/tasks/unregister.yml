---
- name: Obtain removal token
  ansible.builtin.include_tasks: token.yml
  vars:
    runner_token_action: remove
    runner_token_organization: "{{ runner_previous.organization }}"

- name: Unregister this runner without replacing any other runner
  become: true
  become_user: "{{ runner_instance.user }}"
  ansible.builtin.shell:
    cmd: "umask 077; exec ./config.sh remove"
    chdir: "{{ runner_instance.install_dir }}"
    executable: /bin/bash
  environment:
    HOME: "{{ runner_home_root }}/{{ runner_instance.user }}"
    PATH: "{{ runner_service_path }}"
    ACTIONS_RUNNER_INPUT_UNATTENDED: 'true'
    ACTIONS_RUNNER_INPUT_TOKEN: "{{ runner_fresh_token.json.token if runner_effective_api_token | default('') | length > 0 else runner_removal_token }}"
  no_log: true
  changed_when: true
