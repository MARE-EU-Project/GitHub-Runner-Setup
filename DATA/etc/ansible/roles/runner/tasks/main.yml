---
- name: Validate requested runner configuration
  ansible.builtin.import_tasks: validate.yml

- name: Refresh package metadata before guarded runner dependency installation
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install runner runtime dependencies through the guarded package flow
  ansible.builtin.include_role:
    name: tools
    tasks_from: packages.yml
    apply:
      become: true
  vars:
    tools_requested_packages:
      - ca-certificates
      - curl
      - tar
      - libarchive-tools
      - gzip
      - acl
      - libicu-dev
      - libssl-dev
      - libkrb5-3
      - zlib1g
      - libyaml-0-2
      - libgmp10

- name: Create root-controlled runner state directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ runner_state_dir }}"
    - "{{ runner_state_dir }}/accounts"
    - "{{ runner_cache_dir }}"

- name: Install the runner-scoped archive tool without relaxing service confinement
  ansible.builtin.include_tasks: archive-tool.yml

- name: Configure isolated runners
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ runner_instances }}"
  loop_control:
    loop_var: runner_instance
    label: "{{ runner_instance.name }}"
