---
- name: Validate Docker signing-key trust configuration
  ansible.builtin.assert:
    that:
      - docker_apt_key_fingerprint is match('^[A-Fa-f0-9]{40}$')
      - docker_apt_key_sha256 == '' or docker_apt_key_sha256 is match('^[A-Fa-f0-9]{64}$')
  when: docker_package_source == 'upstream'

- name: Create apt key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_package_source == 'upstream'

- name: Download Docker public key to staging, not to the apt trust store
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ tools_cache_dir }}/docker.asc"
    checksum: "{{ ('sha256:' + docker_apt_key_sha256) if docker_apt_key_sha256 | length > 0 else omit }}"
    owner: root
    group: root
    mode: "0644"
  when: docker_package_source == 'upstream'

- name: Create private signing-key inspection directory
  ansible.builtin.file:
    path: "{{ tools_cache_dir }}/gnupg"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: docker_package_source == 'upstream'

- name: Read the Docker key without importing it into a keyring
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --no-options
      - --with-colons
      - --show-keys
      - --fingerprint
      - "{{ tools_cache_dir }}/docker.asc"
  environment:
    GNUPGHOME: "{{ tools_cache_dir }}/gnupg"
  register: tools_docker_key
  changed_when: false
  check_mode: false
  when: docker_package_source == 'upstream'

- name: Verify the exact Docker primary signing-key fingerprint
  ansible.builtin.assert:
    that:
      - >-
        (tools_docker_key.stdout | regex_findall('(?m)^fpr:::::::::([A-Fa-f0-9]+):') | first | upper)
        == (docker_apt_key_fingerprint | upper)
      - tools_docker_key.stdout | regex_findall('(?m)^pub:') | length == 1
    fail_msg: Downloaded Docker signing key does not match the pinned primary fingerprint.
  when: docker_package_source == 'upstream'

- name: Install verified Docker signing key
  ansible.builtin.copy:
    src: "{{ tools_cache_dir }}/docker.asc"
    dest: /etc/apt/keyrings/runner-docker.asc
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: docker_package_source == 'upstream'

- name: Install the system Python dependency for Deb822 repository management
  ansible.builtin.include_tasks: packages.yml
  vars:
    tools_requested_packages: [python3-debian]
  when: docker_package_source == 'upstream'

- name: Configure official Docker apt source for the detected release
  ansible.builtin.deb822_repository:
    name: runner-docker
    types: [deb]
    uris: [https://download.docker.com/linux/ubuntu]
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/runner-docker.asc
    mode: "0644"
    state: present
    install_python_debian: false
  register: tools_docker_repository
  when: docker_package_source == 'upstream'

- name: Remove the superseded repository file managed by this role
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/runner-docker.list
    state: absent
  register: tools_docker_legacy_repository
  when: docker_package_source == 'upstream'

- name: Refresh package metadata after Docker repository changes
  ansible.builtin.apt:
    update_cache: true
  when:
    - docker_package_source == 'upstream'
    - tools_docker_repository.changed or tools_docker_legacy_repository.changed
