---
- name: Resolve the runner account
  ansible.builtin.getent:
    database: passwd
    key: "{{ verification_instance.user }}"
  no_log: true

- name: Verify account availability and directory permissions without a login shell
  become: true
  become_user: "{{ verification_instance.user }}"
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - 'test "$(id -un)" = "$1" && test -r "$2" && test -w "$2" && test -x "$2" && test -x "$2/bin/Runner.Listener" && test -w "$3" && test -x "$3"'
      - mare-verification
      - "{{ verification_instance.user }}"
      - "{{ verification_instance.install_dir }}"
      - "{{ verification_instance.work_dir }}"
  environment:
    PATH: "{{ verification_path | default('/usr/local/bin:/usr/bin:/bin') }}"
  changed_when: false
  no_log: true

- name: Verify Ruby action cache writes and runtime libraries as the service account
  become: true
  become_user: '{{ verification_instance.user }}'
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import ctypes, pathlib, tempfile
        for library in ('libssl.so.3', 'libcrypto.so.3', 'libyaml-0.so.2', 'libgmp.so.10', 'libz.so.1'):
            ctypes.CDLL(library)
        for directory in ('/opt/hostedtoolcache', '/opt/hostedtoolcache/Ruby'):
            with tempfile.TemporaryDirectory(prefix='.mare-toolcache-check-', dir=directory) as temporary:
                source = pathlib.Path(temporary) / 'write-test'
                source.write_text('runner-toolcache-check')
                target = source.with_name('renamed')
                source.rename(target)
                assert target.read_text() == 'runner-toolcache-check'
  environment:
    PATH: '{{ verification_path }}'
    HOME: '{{ ansible_facts.getent_passwd[verification_instance.user][4] }}'
  changed_when: false

- name: Check runner service health separately from software versions
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "mare-runner-{{ verification_instance.name }}.service"
  changed_when: false
  no_log: true

- name: Verify the service runs under the intended unprivileged account
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "mare-runner-{{ verification_instance.name }}.service"
      - --property=User
      - --value
  register: verification_service_user
  changed_when: false
  failed_when: verification_service_user.rc != 0 or verification_service_user.stdout | trim != verification_instance.user
  no_log: true

- name: Read the actual installed Actions runner version as its account
  become: true
  become_user: "{{ verification_instance.user }}"
  ansible.builtin.command:
    argv: ["{{ verification_instance.install_dir }}/bin/Runner.Listener", --version]
  environment:
    PATH: "{{ verification_path }}"
    HOME: "{{ ansible_facts.getent_passwd[verification_instance.user][4] }}"
  register: verification_runner_version
  changed_when: false
  failed_when: >-
    verification_runner_version.rc != 0 or
    verification_runner_version.stdout | trim is not match('^[0-9]+[.][0-9]+[.][0-9]+$') or
    verification_runner_version.stdout | trim is version(runner_version, '<')
  no_log: true

- name: Verify enabled software versions as the runner account
  become: true
  become_user: "{{ verification_instance.user }}"
  ansible.builtin.command:
    argv: "{{ item.command }}"
  environment:
    PATH: "{{ verification_path | default('/usr/local/bin:/usr/bin:/bin') }}"
    HOME: "{{ ansible_facts.getent_passwd[verification_instance.user][4] }}"
  loop: "{{ verification_tools | selectattr('enabled', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: verification_version_results
  changed_when: false
  failed_when: >-
    verification_version_results.rc != 0 or
    (verification_version_results.stdout is not search(
      ('vagrant-libvirt \\(' if item.name == 'vagrant_libvirt' else '(?<![0-9.])v?') ~
      (item.version | regex_escape) ~ '(?![0-9.])'))
  no_log: true

- name: Verify Docker daemon access as the runner account
  become: true
  become_user: "{{ verification_instance.user }}"
  ansible.builtin.command:
    argv: [docker, info, "--format", "{{ '{{' }}.ServerVersion{{ '}}' }}"]
  environment:
    PATH: "{{ verification_path | default('/usr/local/bin:/usr/bin:/bin') }}"
    HOME: "{{ ansible_facts.getent_passwd[verification_instance.user][4] }}"
  changed_when: false
  when: docker_enabled | default(false) | bool
  no_log: true

- name: Verify libvirt access as the runner account
  become: true
  become_user: "{{ verification_instance.user }}"
  ansible.builtin.command:
    argv: [virsh, --connect, qemu:///system, list, --name]
  environment:
    PATH: "{{ verification_path | default('/usr/local/bin:/usr/bin:/bin') }}"
    HOME: "{{ ansible_facts.getent_passwd[verification_instance.user][4] }}"
  changed_when: false
  when: virtualization_enabled | default(false) | bool
  no_log: true

- name: Verify the runner-private Kubernetes context and default profile
  become: true
  become_user: '{{ verification_instance.user }}'
  vars:
    verification_minikube_profile: "{{ verification_instance.minikube_profile | default(minikube_profile + ('-' + verification_instance.name if runner_instances | length > 1 else '')) }}"
  environment:
    PATH: '{{ verification_path }}'
    HOME: '/home/{{ verification_instance.user }}'
    KUBECONFIG: '/home/{{ verification_instance.user }}/.config/runner-kubernetes/{{ verification_minikube_profile }}/config'
    MINIKUBE_PROFILE: '{{ verification_minikube_profile }}'
  when: minikube_enabled | default(false) | bool and minikube_initialize | default(false) | bool
  block:
    - name: Require the harness-compatible private context
      ansible.builtin.command:
        argv: [kubectl, config, current-context]
      register: verification_job_context
      changed_when: false
      failed_when: verification_job_context.rc != 0 or verification_job_context.stdout | trim != 'minikube'

    - name: Require a Ready node in the intended cluster
      ansible.builtin.command:
        argv: [kubectl, wait, --for=condition=Ready, node, --all, --timeout=30s]
      changed_when: false

    - name: Verify default Minikube invocation resolves the owned profile
      ansible.builtin.command:
        argv: [minikube, status, --output=json]
      register: verification_job_profile
      changed_when: false
      failed_when: >-
        verification_job_profile.rc != 0 or
        (verification_job_profile.stdout | from_json).Name != verification_minikube_profile or
        (verification_job_profile.stdout | from_json).APIServer != 'Running'

    - name: Verify the harness's explicit default-profile alias
      ansible.builtin.command:
        argv: [minikube, -p, minikube, status, --output=json]
      register: verification_job_profile_alias
      changed_when: false
      failed_when: >-
        verification_job_profile_alias.rc != 0 or
        (verification_job_profile_alias.stdout | from_json).Name != verification_minikube_profile or
        (verification_job_profile_alias.stdout | from_json).APIServer != 'Running'

- name: Assemble a version-only account inventory
  ansible.builtin.set_fact:
    verification_account_tools: >-
      {{ verification_account_tools | default([]) +
         [{'name': item.item.name,
           'version': item.stdout | regex_search('(?<![0-9.])' ~ (item.item.version | regex_escape) ~ '(?![0-9.])'),
           'source': item.item.source}] }}
  loop: "{{ verification_version_results.results }}"
  no_log: true

- name: Append the verified account inventory
  ansible.builtin.set_fact:
    verification_inventory: >-
      {{ verification_inventory + [{'instance': verification_instance.name,
         'runner': {'version': verification_runner_version.stdout | trim,
           'minimum_version': runner_version,
           'source': 'https://github.com/actions/runner/releases/tag/v' ~ (verification_runner_version.stdout | trim)},
         'tools': verification_account_tools | default([])}] }}
    verification_account_tools: []
  no_log: true
